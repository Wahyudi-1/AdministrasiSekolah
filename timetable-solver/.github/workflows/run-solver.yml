name: Timetable Solver Engine

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID dari Supabase'
        required: false
        default: ''
  repository_dispatch:
    types: [generate-timetable]

jobs:
  solve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'solver/requirements.txt'

      - name: Install OR-Tools & Supabase
        run: pip install -r solver/requirements.txt

      - name: Jalankan Perhitungan Jadwal
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_ACTIONS: "true"
        run: |
          JOB_ID="${{ github.event.inputs.job_id || github.event.client_payload.job_id }}"
          python solver/cli_solver.py "$JOB_ID"
