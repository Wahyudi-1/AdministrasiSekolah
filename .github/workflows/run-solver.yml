name: Timetable Solver Engine

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'ID Job dari tabel generation_jobs'
        required: false
        default: ''
      school_id:
        description: 'UUID Sekolah (Tenant ID)'
        required: true
        default: ''

jobs:
  solve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install OR-Tools, Supabase & Dependencies
        run: |
          pip install --upgrade pip
          if [ -f "app/requirements.txt" ]; then
            pip install -r app/requirements.txt
          else
            pip install ortools supabase python-dotenv
          fi

      - name: Jalankan Perhitungan Jadwal Multi-Sekolah
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
          SCHOOL_ID: ${{ github.event.inputs.school_id }}
        run: |
          if [ -f "app/cli_solver.py" ]; then
            python app/cli_solver.py "$JOB_ID" "$SCHOOL_ID"
          elif [ -f "solver/solver.py" ]; then
            python solver/solver.py "$JOB_ID" "$SCHOOL_ID"
          else
            python cli_solver.py "$JOB_ID" "$SCHOOL_ID"
          fi
