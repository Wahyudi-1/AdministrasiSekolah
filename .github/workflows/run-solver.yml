name: Timetable Solver Engine

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'ID Job dari tabel generation_jobs'
        required: false
        default: ''
      school_id:
        description: 'UUID Sekolah (Tenant ID)'
        required: false
        default: ''

jobs:
  solve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install OR-Tools & Supabase
        run: |
          pip install --upgrade pip
          pip install ortools supabase

      - name: Jalankan Perhitungan Jadwal Multi-Sekolah
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
          SCHOOL_ID: ${{ github.event.inputs.school_id }}
        run: |
          if [ -f "solver/solver.py" ]; then
            python solver/solver.py
          elif [ -f "timetable-solver/solver.py" ]; then
            python timetable-solver/solver.py
          else
            python solver.py
          fi
